# Build the white cell site (tools/build_all.sh) and publish it to GitHub Pages.
#
# Two ways it runs:
#   - By hand, in any copy (Actions -> Publish site -> Run workflow).
#   - On every push to main, but only in the base repository itself (Det-520/matrix-wargame), which
#     holds nothing but the placeholder example. That keeps a live demo of the base online.
#     A copy made into a scenario has a different name, so a push there never publishes.
#
# WHITE CELL ONLY in a real scenario: the site shows both sides' secrets, and a Pages site
# is public even when the repository is private. To publish a scenario on every push
# anyway, set the repository variable PUBLISH_ON_PUSH to true (Settings -> Secrets and
# variables -> Actions -> Variables), and only if you accept that.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# WordCraft doesn't run here, so the Tongue and Quill documents come from the copies
# committed in handouts/word/: rebuild them locally (tools/tq/build_tq.py) and commit
# them when their markdown changes.
name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.repository == 'Det-520/matrix-wargame' ||
      vars.PUBLISH_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages and Chromium
        run: |
          pip install jinja2 markdown-it-py mdit-py-plugins pypdf playwright numpy "shapely>=2" pillow
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin" || exit 1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Air Force reference PDFs often refuse scripted downloads, and the
      # build doesn't need them; build_all.sh stops if the fonts are missing.
      - name: Fetch fonts
        run: python3 -I tools/fetch_third_party.py || true

      # Every document template renders, and the timer settings match game.toml.
      - name: Check the run of show
        run: python3 -I tools/schedule.py --check

      # The asset reference matches the asset catalog it is generated from.
      - name: Check the presets
        run: python3 -I tools/presets.py reference --check

      - name: Build map, handouts, and site
        run: SKIP_TQ=1 tools/build_all.sh
        env:
          # The base's own demo says so on its front page.
          MW_DEMO: ${{ github.repository == 'Det-520/matrix-wargame' && '1' || '' }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
