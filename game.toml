# The facts about this game that the tools need. Edit these when you start a new
# scenario; everything else the tools read comes from the markdown and the CSV.
# Read by tools/game.py (standard library tomllib, Python 3.11 or later).

[game]
name = "Operation Example"          # the scenario's name: PDF headers, counters, site, stamps
designer = "C/Lastname"             # owner and designer, written into PDF metadata
event = "AFROTC LLAB N"             # the event that hosts the game
date = "1 January 2027"             # event date as written in prose
date_short = "01Jan2027"            # event date in the PDF running headers
tables = 4                          # tables (groups) playing at once: one Print Packet each

# The scenario-free release (rules handbook and player forms) goes out before the
# scenario is announced, so it carries a generic header instead of the game's name.
rules_label = "Matrix Wargame"
rules_date = "January 2027"

[rules]
# The rule set the game is played with (RULES.md §0):
#   "full"  - every rule. Players get the Player Rules Handbook (and the Basic Rules as a first read).
#   "basic" - for groups new to matrix games: no secret COAs and no estimative vote. Players
#             get the Basic Rules instead; the forms, packet, timer, and white cell
#             documents follow.
# A text that holds for one rule set only goes inside {% if rules == 'full' %} ... {% endif %}
# (single quotes in this file), as in the markdown.
set = "full"

[turns]
# The number of turns comes from the run of show below (the sum of every block's `turns`).
requests_per_turn = 3               # RFIs and RFFs combined (RULES.md §5)
planning_requests = 4               # Phase I limit (RULES.md §2.3)
secret_coas = 2                     # one per playing phase (RULES.md §3.4); none print under the basic rules
game_days = 3                       # days of game time one turn stands for (RULES.md §2.1); 0.5 = 12 hours

# ---------------------------------------------------------------- run of show
# The game's phase structure and timing (RULES.md §2.1, EVENT-SETUP.md §3). The timer
# program, the schedule tables in the handouts, and the turn count all come from here:
# change it, and the next build follows (the timer: `python3 tools/schedule.py --write`).
# Every `min` is minutes and may be a fraction (0.5 = 30 seconds).
#
# Each [[block]] is one entry on the timer's run-of-show bar, in order. It is either
#   - a block of `turns = N` full turns, each one run with the [[turn_step]] list below, or
#   - a block with its own [[block.step]] list (planning, an inject, a debrief, a break).
# Block fields: name (long), short (on the bar), tag (2-3 letters, in the dice log),
#   brief (optional, players' schedule: what the players do).
# Step fields: name, min, who, side (a [[side]] id: the step is that team's, in its colour), say (the script or
#   action shown on the timer, which is on the room's screen, so nothing secret), and
#   brief (optional, players' schedule; for a [[turn_step]], the players' turn clock
#   table). requests_due = true marks the planning step at whose end the planning
#   requests are due (the documents quote that minute).
# Text can use {turn}, {first} and {last} (turn numbers) and {min} (the step's minutes),
# which the timer fills in as it runs. Texts are also Jinja2 templates, like the
# documents: {{ requests }}, {{ blocks.P1.min }}, {{ word(planning_requests) }} ("four").
# `python3 tools/schedule.py values` lists every name.

[schedule]
start = "1345"        # 24-hour clock time the first block starts, for the printed tables; "" prints minutes from the start
parley = 2            # minutes a parley may run alongside the first turn step (RULES.md §6.1); 0 hides the parley timer
flex_step = "prep"    # the turn step the lead adjudicator may shorten when behind (RULES.md §8.4); "" for none
flex_options = [5, 4, 3]

[[block]]
tag = "P1"
short = "Phase I"
name = "Phase I – Planning"
brief = "Organize your team, synthesize your pre-read intel, and build a plan. No COAs (§1.3)."
  [[block.step]]
  name = "Team planning & requests"
  min = 12
  who = "Both teams"
  requests_due = true
  say = "“You have {{ blocks.P1.min }} minutes to organize your team, synthesize your intelligence, and build a plan. You may submit up to {{ word(planning_requests) }} requests, RFIs or RFFs, due at minute {{ request_deadline }}. In the last three minutes you will brief your plan to your logger. There are no COAs in Phase I. Your time starts now.”"
  brief = "Plan and post up to **{{ planning_requests }} requests** (RFIs/RFFs) in your team's secret Slack channel. **Due at the end of this step.**"
  [[block.step]]
  name = "Brief rehearsal"
  min = 3
  who = "Both teams"
  say = "“Six minutes left in Phase I. Requests close now. We'll answer the first {{ word(planning_requests) }} posted in your team channel. You have three minutes to rehearse before you brief your logger.” Answer the requests during this step and the next."
  brief = "Finalize and rehearse your brief."
  [[block.step]]
  name = "OPORD briefs"
  min = 3
  who = "Teams → loggers"
  say = "Each logger hears its team's oral brief and writes its planned COAs (up to 3, Turns 1–3) and the starting zones of any hidden counters the team places itself on the placement form (White Cell Forms §4)."
  brief = "Brief your plan and up to 3 planned COAs to your logger (§1.3)."

[[block]]
tag = "KO"
short = "Kickoff"
name = "Kickoff inject"
  [[block.step]]
  name = "Kickoff inject"
  min = 2
  who = "White cell"
  say = "Read the kickoff inject and set any tracks it moves. Loggers post Phase I RFI answers and RFF rulings in each team channel."
  brief = "The white cell announces that the war has begun and posts Phase I RFI answers and RFF rulings in your team channel."

[[block]]
tag = "P2"
short = "Phase II"
name = "Phase II"
turns = 4

[[block]]
tag = "D1"
short = "Debrief 1"
name = "Debrief 1"
  [[block.step]]
  name = "Debrief 1"
  min = 7
  who = "Phase I–II flight commanders"
  say = "Phase I–II flight commanders lead the debrief. Afterward, hand command to the Phase III–IV flight commanders."
  brief = "Led by your Phase I–II flight commander. **The Phase III–IV flight commander takes over afterward.**"

[[block]]
tag = "P3"
short = "Phase III"
name = "Phase III – Planning and FRAGO"
  [[block.step]]
  name = "Phase III planning"
  min = 7
  who = "Both teams"
  say = "Teams plan under the new flight commanders."
  brief = "Phase IV planning under the new flight commander."
  [[block.step]]
  name = "FRAGO to loggers"
  min = 1
  who = "Teams → loggers"
  say = "“One minute left in Phase III. Phase III–IV flight commanders, brief your one-minute FRAGO and up to two Phase IV planned COAs to your logger now.”"
  brief = "The new flight commander gives a **1-minute oral FRAGO** (updated intent and up to 2 new planned COAs) to the logger (§1.4)."

[[block]]
tag = "P4"
short = "Phase IV"
name = "Phase IV"
turns = 3

[[block]]
tag = "D2"
short = "Debrief 2"
name = "End of game & Debrief 2"
  [[block.step]]
  name = "End of game & Debrief 2"
  min = 7
  who = "Phase III–IV flight commanders"
  say = "“That was the final turn. Here is where things stand.” Read the tracks and key map facts, and score (handbook §8). Phase III–IV flight commanders lead Debrief 2."
  brief = "The white cell scores objectives; your Phase III–IV flight commander leads Debrief 2."

# The steps of one full turn, in order (RULES.md §2.2). The teams brief in the order of
# [[side]]. Each team has a COA step and a Cons step. A third team adds one of each (after
# the other COA steps, and after the other Cons steps) and about one more minute of resolve
# time (RULES.md §2.6), for example:
#   [[turn_step]]
#   id = "gcoa"
#   name = "GRAYFOR COA + Pros"
#   min = 2
#   who = "GRAYFOR"
#   side = "grayfor"
#   say = "“GRAYFOR, your COA.” No interruptions."
[[turn_step]]
id = "prep"
name = "Prepare"
min = 5
who = "Both teams"
say = "“Turn {turn}. Prepare, {min} minutes. Your RFI answers are in your team channel. Requests are due there when the timer ends.” Check last turn's RFI answers are posted. Authorize parleys (up to {{ parley }} minutes) on request and listen in. At the end, close requests: count the first {{ requests }} request posts per team and don't answer extras or late posts."
brief = "Pick this turn's COA. Post up to {{ requests }} RFIs/RFFs in your team channel. When this step ends, requests close: the white cell counts your first {{ requests }} posts, and later or extra posts aren't answered. Negotiate if you want (a parley, up to {{ parley }} minutes). Last turn's RFI answers are in your team channel at the start."

[[turn_step]]
id = "bcoa"
name = "BLUEFOR COA + Pros"
min = 2
who = "BLUEFOR"
side = "bluefor"
say = "“BLUEFOR, your COA.” No interruptions."
brief = "Brief aloud: action, measurable effect, up to 3 reasons. Post the same COA in the group channel before the step ends."

[[turn_step]]
id = "rcoa"
name = "REDFOR COA + Pros"
min = 2
who = "REDFOR"
side = "redfor"
say = "“REDFOR, your COA.” No interruptions. REDFOR may react to BLUEFOR's COA but not negate it."
brief = "Brief aloud: action, measurable effect, up to 3 reasons. Post the same COA in the group channel before the step ends."

[[turn_step]]
id = "pcons"
name = "Prepare Cons"
min = 2
who = "Both teams"
say = "“{{ Word(steps.pcons.min) }} minutes to prepare Cons.” Note the Pros you'll accept while they huddle."
brief = "Huddle to pick up to 3 Cons against the other team's COA."

[[turn_step]]
id = "rcons"
name = "REDFOR Cons → BLUEFOR COA"
min = 1
who = "REDFOR"
side = "redfor"
say = "“REDFOR, your Cons on BLUEFOR's COA.”"
brief = "Up to 3 reasons BLUEFOR's COA fails or has costs. Post them in the group channel before the step ends."

[[turn_step]]
id = "bcons"
name = "BLUEFOR Cons → REDFOR COA"
min = 1
who = "BLUEFOR"
side = "bluefor"
say = "“BLUEFOR, your Cons on REDFOR's COA.”"
brief = "Up to 3 reasons REDFOR's COA fails or has costs. Post them in the group channel before the step ends."

[[turn_step]]
id = "res"
name = "White cell resolves"
min = 2
who = "White cell"
say = "Resolve both COAs (BLUEFOR's first). Rule on RFFs and give arrival turns (N = this turn). Place counters for forces arriving next turn; they can be used in next turn's COA. Track checks: per-turn track effects and trigger values; starting conditions that switch on at a set turn; RFF arrivals{% if rules == 'full' %}; secret COA triggers{% endif %}. At most one inject. Loggers move counters and tracks and update the placement forms."
brief = "Rolls, narrates, rules on RFFs, moves counters and tracks, maybe an inject."

# ---------------------------------------------------------------- tracks
# The scenario's tracks (scenario/00-overview.md §5.1), shown on the timer program's
# screen. EXAMPLE TRACKS: replace them with the scenario's. Give a track either
# `values` (words, in order) or `range = [low, high]` (whole numbers). `ends` labels a
# two-sided numeric scale (low end first). Each trigger has `at` (that value), `min`
# (that value or higher), or `max` (that value or lower), and the text the timer shows.
[[track]]
id = "access"
name = "Sea Lane Access"
values = ["Open", "Restricted", "Closed"]
start = "Open"
triggers = [{ at = "Closed", text = "Red Will −1 at the end of each turn it stays Closed." }]

[[track]]
id = "opinion"
name = "International Opinion"
range = [-3, 3]
start = 0
ends = ["Pro-Blue", "Pro-Red"]
triggers = [
  { at = 3, text = "A wavering third party sides with REDFOR." },
  { at = -3, text = "BLUEFOR's backer escalates its support." },
]

[[track]]
id = "will"
name = "Red Domestic Will"
range = [0, 5]
start = 3
triggers = [
  { min = 4, text = "Big REDFOR RFFs approved more readily." },
  { at = 0, text = "REDFOR's government orders a ceasefire and negotiations." },
]

[[track]]
id = "stability"
name = "Blue Regime Stability"
range = [0, 5]
start = 4
triggers = [{ at = 0, text = "BLUEFOR's government collapses." }]

# ---------------------------------------------------------------- teams
# The player teams, in briefing order: the first one listed briefs its COA first in every
# turn (RULES.md §2.2). Two teams is the default. For a third player team (GRAYFOR, a
# coalition partner with its own agenda, an insurgency), add a [[side]], give it a COA step
# and a Cons step in [[turn_step]] (side = its id), and copy a team's files for it
# (DESIGN-GUIDE.md §2.1). Fields:
#   id      folder name: handouts/<id>/ and scenario/<id>-packet.md; a step's `side` names it
#   label   what the documents call the team; its release folder is "<label> - 24H RELEASE"
#   nation  who the team plays in the game world
#   prefix  one capital letter for its IDs: assets B-01, intelligence products BI-01,
#           starting conditions S-B1, objectives B1 (X and S are taken)
#   color   its colour on counters, PDFs, the site, and the timer (#rrggbb)
#
# Cells (optional): [[side.cell]] splits a team into cells under its commander, such as
# intelligence, communications, and an air component (RULES.md §9.1). The team still makes
# one COA a turn. Fields: id, name, short (up to 4 letters, printed on its counters),
# lead (the cell lead's title), job (one line). A cell owns the assets whose `cell` column
# in scenario/data/assets.csv names it, and gets its own brief if
# handouts/<side id>/cells/<cell id>.md exists.
[[side]]
id = "bluefor"
label = "BLUEFOR"
nation = "Blueland"
prefix = "B"
color = "#0969da"

[[side]]
id = "redfor"
label = "REDFOR"
nation = "Redland"
prefix = "R"
color = "#cf222e"
#  [[side.cell]]
#  id = "air"
#  name = "Air Component"
#  short = "AIR"
#  lead = "Air component commander"
#  job = "Plans and briefs the air COAs; owns the fighters, bombers, and tankers"
#  [[side.cell]]
#  id = "intel"
#  name = "Intelligence Cell"
#  short = "INT"
#  lead = "Senior intelligence officer"
#  job = "Owns the RFIs and the ISR assets; keeps the enemy picture"

# [[side]]
# id = "grayfor"
# label = "GRAYFOR"
# nation = "Grayland"
# prefix = "G"
# color = "#6e7781"

[map]
svg = "map/source/map.svg"          # the master map, drawn in any tool and saved as SVG
name = "game_map"                   # builds map/maps/<name>_full.pdf and <name>_tiles_letter.pdf
tiles = 3                           # the letter tiles are tiles x tiles pages

# Tongue and Quill documents built with WordCraft (tools/tq/build_tq.py). One entry
# per document: key is the output name in handouts/word/, kind is "memo" or "letter",
# letterhead is three lines (line 1 may come from the markdown instead), and mark
# (intelligence products only) is the audience marking printed in the product stamp.
# An intelligence product's key starts with its ID (RI-07 ...), so the build swaps
# the Word PDF in for the markdown version.
[[tq]]
key = "REDFOR - Commander's Letter"
src = "handouts/redfor/commanders-letter.md"
kind = "memo"
letterhead = ["[RED NATION] MINISTRY OF DEFENSE", "OFFICE OF THE CHIEF OF STAFF", ""]

[[tq]]
key = "BLUEFOR - Commander's Letter"
src = "handouts/bluefor/commanders-letter.md"
kind = "letter"
letterhead = ["OFFICE OF THE PRESIDENT", "[BLUE NATION]", "[CAPITAL]"]
